name: 100m_elf_noisy
seed: 42
output_dir: outputs/official_elf/2026_100M

training:
  epochs: 10
  batch_size: 32
  gradient_accumulation_steps: 2
  precision: bf16
  log_every: 50
  latest_every_steps: 500
  checkpoint_by_words: true
  checkpoint_word_limit: 1_000_000_000

model:
  embedding_size: 512
  hidden_size: 768
  intermediate_size: 3_072
  num_hidden_layers: 12
  num_attention_heads: 12
  max_position_embeddings: 128
  bottleneck_size: 128
  embedding_source: learnable

data:
  source: huggingface
  hf_dataset: BabyLM-community/BabyLM-2026-Strict
  hf_revision: 9e57baaaa91ac3c638746be14d1d5fa6c789f4cf
  train_text: data/2026_100M/raw/train_100M.txt
  train_path: data/2026_100M/tokenized/train_100M.bin
  tokenizer_path: data/2026_100M/tokenizer/tokenizer.json
  manifest_path: data/2026_100M/manifest.json
  seq_length: 128
  train_word_count: 100_000_000

optimizer:
  type: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  max_grad_norm: 1.0

scheduler:
  type: cosine
  warmup_epochs: 0.5
  min_lr: 3.0e-5

ema:
  reference_decay: 0.9999
  reference_steps: 95_000
  warmup: true
  scale_to_run: true

objective:
  type: elf_noisy_ce
  targets: {filter_empty_control: true}
  time_schedule: logit_normal
  denoiser_p_mean: -1.5
  denoiser_p_std: 0.8
  denoiser_noise_scale: 2.0
  decoder_probability: 0.2
  self_condition_probability: 0.5
  self_condition_cfg_min: 0.5
  self_condition_cfg_max: 5.0
  t_eps: 0.05
  decoder_noise_scale: 5.0
  decoder_p_mean: 0.8
  decoder_p_std: 0.8
