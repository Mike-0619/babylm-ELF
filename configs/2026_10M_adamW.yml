name: adamW
seed: 42
output_dir: outputs/2026_10M
max_steps: 0
epochs: 10
batch_size: 4
gradient_accumulation_steps: 8
log_every: 50
validate_every: 1000
save_every: 0
checkpoint_by_words: true
checkpoint_word_limit: 100000000
mixed_precision: true

model:
  vocab_size: 16384
  embedding_size: 512
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 12
  num_attention_heads: 12
  max_position_embeddings: 1024
  hidden_dropout_prob: 0.0
  layer_norm_eps: 0.000001
  bottleneck_size: 128
  num_time_tokens: 4
  num_self_cond_cfg_tokens: 4
  num_model_mode_tokens: 4
  pad_token_id: 3
  embedding_rms: 1.0

data:
  source: huggingface
  hf_dataset: BabyLM-community/BabyLM-2026-Strict-Small
  hf_config: null
  hf_train_split: train
  hf_valid_split: null
  hf_text_field: text
  train_text: data/2026_10M/raw/train_10M.txt
  valid_text: null
  train_path: data/2026_10M/tokenized/train_10M.bin
  valid_path: null
  tokenizer_path: data/2026_10M/tokenizer/tokenizer.json
  tokenizer_vocab_size: 16384
  seq_length: 1024
  num_workers: 0
  train_word_count: 10000000

optim:
  # Optimizer ablation: AdamW updates all trainable parameters.
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  eps: 0.00000001
  max_grad_norm: 1.0
  warmup_steps: -1
  warmup_epochs: 0.5
  lr_schedule: constant
  min_lr: 0.0
  ema_decay: 0.9999

diffusion:
  prediction_type: x0
  time_schedule: logit_normal
  denoiser_p_mean: -1.5
  denoiser_p_std: 0.8
  denoiser_noise_scale: 2.0
  decoder_probability: 0.2
  decoder_p_mean: 0.8
  decoder_p_std: 0.8
  decoder_noise_scale: 5.0
  self_condition_probability: 0.5
  self_condition_cfg_min: 0.5
  self_condition_cfg_max: 5.0
  t_eps: 0.05
