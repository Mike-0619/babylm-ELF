name: smoke
seed: 42
output_dir: outputs
max_steps: 2
batch_size: 2
gradient_accumulation_steps: 1
log_every: 1
validate_every: 1
save_every: 1000
mixed_precision: false

model:
  vocab_size: 384
  hidden_size: 64
  intermediate_size: 128
  num_hidden_layers: 2
  num_attention_heads: 4
  max_position_embeddings: 64
  hidden_dropout_prob: 0.0
  layer_norm_eps: 0.000001
  pad_token_id: 3

data:
  source: local_text
  hf_dataset: null
  hf_config: null
  hf_train_split: train
  hf_valid_split: null
  hf_text_field: text
  train_text: data/smoke/raw/train.txt
  valid_text: data/smoke/raw/valid.txt
  train_path: data/smoke/tokenized/train.bin
  valid_path: data/smoke/tokenized/valid.bin
  tokenizer_path: data/smoke/tokenizer/tokenizer.json
  tokenizer_vocab_size: 384
  tokenizer_min_frequency: 1
  seq_length: 32
  num_workers: 0

optim:
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.01
  max_grad_norm: 2.0
  warmup_steps: 1
  ema_decay: 0.999

diffusion:
  prediction_type: x0
  time_schedule: linear
  noise_scale: 1.0
  flow_loss_weight: 1.0
  decode_loss_weight: 0.25
