name: learnable_token_mlm_oneperseg_len16_40_filter_punct_ctrl_s0_seq128_ce20_bert_head_scaled_muon_size33m_gb128_official_lr5e-2_4gpu
seed: 42
output_dir: outputs/2026_10M
max_steps: 0
epochs: 10
batch_size: 32
gradient_accumulation_steps: 1
log_every: 50
validate_every: 1000
save_every: 0
checkpoint_by_words: true
checkpoint_word_limit: 100000000
mixed_precision: true
device: auto

model:
  vocab_size: 16384
  base_vocab_size: 16384
  embedding_size: 384
  hidden_size: 512
  intermediate_size: 2048
  num_hidden_layers: 8
  num_attention_heads: 8
  max_position_embeddings: 128
  hidden_dropout_prob: 0.0
  layer_norm_eps: 0.000001
  bottleneck_size: 96
  num_time_tokens: 4
  num_self_cond_cfg_tokens: 4
  num_model_mode_tokens: 4
  pad_token_id: 3
  mask_token_id: 4
  embedding_rms: 1.0
  embedding_source: learnable
  decoder_head_type: bert_mlm_scaled

data:
  source: huggingface
  hf_dataset: BabyLM-community/BabyLM-2026-Strict-Small
  hf_config: null
  hf_train_split: train
  hf_valid_split: null
  hf_text_field: text
  train_text: data/2026_10M/raw/train_10M.txt
  valid_text: null
  train_path: data/2026_10M/tokenized/train_10M.bin
  valid_path: null
  tokenizer_path: data/2026_10M/tokenizer/tokenizer.json
  manifest_path: data/2026_10M/manifest.json
  tokenizer_vocab_size: 16384
  seq_length: 128
  num_workers: 0
  train_word_count: 10000000

optim:
  optimizer: muon
  learning_rate: 0.05
  aux_learning_rate: 0.005
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
  max_grad_norm: 1.0
  warmup_steps: -1
  warmup_epochs: 0.5
  lr_schedule: constant
  min_lr: 0.0
  ema_reference_decay: 0.9999
  ema_reference_steps: 95000
  ema_warmup: true

diffusion:
  prediction_type: x0
  time_schedule: logit_normal
  denoiser_p_mean: -1.5
  denoiser_p_std: 0.8
  denoiser_noise_scale: 2.0
  decoder_objective: token_mlm
  decoder_probability: 0.2
  mlm_mask_strategy: one_per_segment_step10_then_step20
  mlm_segment_aware: true
  mlm_segment_boundary_token_id: 1
  mlm_special_token_count: 16
  mlm_filter_punctuation_only: true
  mlm_filter_empty_control: true
  mlm_eval_adapter: mlm_mask_latent
  mlm_mask_latent_seed: 0
  mlm_mask_latent_scale: 1.0
  self_condition_probability: 0.5
  self_condition_cfg_min: 0.5
  self_condition_cfg_max: 5.0
  t_eps: 0.05
